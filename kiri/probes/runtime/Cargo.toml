[package]
name = "kiri-runtime-probe"
version = "0.1.0"
edition = "2021"
publish = false

# A minimal Tauri app that runs Kiri's engine code for real on Linux
# (run.sh, Docker) and Windows (run.ps1). Not part of Misty's build.
[dependencies]
kiri = { path = "../.." }
tauri = { version = "=2.11.3" }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0", features = ["v2_40"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[build-dependencies]
tauri-build = { version = "2" }

[patch.crates-io]
wry = { path = "../../../src-tauri/vendor/wry" }
glib = { path = "../../../src-tauri/vendor/glib" }
