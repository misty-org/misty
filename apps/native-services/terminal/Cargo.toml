[package]
name = "misty-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
portable-pty = "0.9"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

[profile.release.build-override]
strip = false
