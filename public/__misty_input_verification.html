<!doctype html><html lang="en"><meta charset="utf-8"><title>Misty input verification</title><style>body{font:24px system-ui;background:#111;color:#eee;margin:64px}label,output{display:block;margin:24px 0}textarea{width:85%;height:180px;font:28px system-ui;background:#222;color:#fff;border:2px solid #aaa;padding:20px}output{white-space:pre-wrap}</style><h1>Local input verification</h1><label for="message">Test message</label><textarea id="message" autocomplete="off" placeholder="Click here and type the test text"></textarea><output id="value">Current value: empty</output><script>document.getElementById('message').addEventListener('input',e=>document.getElementById('value').textContent='Current value: '+e.target.value)</script></html>
