# All file access goes through one gate, src/infra/file_access (docs/plans/app-permissions.md). It
# refuses anything without a grant, so calling the standard library directly would skip the check.
# Only file_access allows these, and tests may build fixtures with them.
disallowed-methods = [
  { path = "std::fs::read", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::read_to_string", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::write", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::create_dir", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::create_dir_all", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::remove_file", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::remove_dir", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::remove_dir_all", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::rename", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::copy", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::hard_link", reason = "Misty has no use for hard links, which would get around the file gate" },
  { path = "std::fs::soft_link", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::metadata", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::symlink_metadata", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::read_link", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::read_dir", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::canonicalize", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::set_permissions", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::fs::exists", reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::os::unix::fs::symlink", allow-invalid = true, reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::os::windows::fs::symlink_dir", allow-invalid = true, reason = "Use file_access::fs, which checks the path against what's granted" },
  { path = "std::os::windows::fs::symlink_file", allow-invalid = true, reason = "Use file_access::fs, which checks the path against what's granted" },
  # The same calls, spelled as methods on a path.
  { path = "std::path::Path::exists", reason = "Use file_access::fs::exists, which checks the path against what's granted" },
  { path = "std::path::Path::try_exists", reason = "Use file_access::fs::exists, which checks the path against what's granted" },
  { path = "std::path::Path::is_file", reason = "Use file_access::fs::is_file, which checks the path against what's granted" },
  { path = "std::path::Path::is_dir", reason = "Use file_access::fs::is_dir, which checks the path against what's granted" },
  { path = "std::path::Path::metadata", reason = "Use file_access::fs::metadata, which checks the path against what's granted" },
  { path = "std::path::Path::symlink_metadata", reason = "Use file_access::fs::symlink_metadata, which checks the path against what's granted" },
  { path = "std::path::Path::read_dir", reason = "Use file_access::fs::read_dir, which checks the path against what's granted" },
  { path = "std::path::Path::read_link", reason = "Use file_access::fs::read_link, which checks the path against what's granted" },
  { path = "std::path::Path::canonicalize", reason = "Use file_access::fs::canonicalize, which checks the path against what's granted" },
  { path = "tokio::fs::read", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::read_to_string", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::write", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::create_dir", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::create_dir_all", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::remove_file", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::remove_dir", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::remove_dir_all", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::rename", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::copy", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::metadata", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::symlink_metadata", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::read_link", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::read_dir", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::canonicalize", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::set_permissions", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  # A database is a file too.
  { path = "rusqlite::Connection::open", reason = "Use file_access::fs::open_sqlite, which checks the path against what's granted" },
  { path = "rusqlite::Connection::open_with_flags", reason = "Use file_access::fs::open_sqlite_with_flags, which checks the path against what's granted" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "Use file_access::fs::File, which checks the path against what's granted" },
  { path = "std::fs::OpenOptions", reason = "Use file_access::fs::OpenOptions, which checks the path against what's granted" },
  { path = "std::fs::DirBuilder", reason = "Use file_access::fs::DirBuilder, which checks the path against what's granted" },
  { path = "tokio::fs::File", reason = "Use file_access::fs_async, which checks the path against what's granted" },
  { path = "tokio::fs::OpenOptions", reason = "Use file_access::fs_async, which checks the path against what's granted" },
]
