# Grants: which of the person's things Misty can reach. Each is driven by a click, and what was
# actually granted lives in misty.db on this device and never syncs (docs/plans/app-permissions.md).
# Enforced by the file gate, src-tauri/src/infra/file_access. Nothing here allows a command by itself.

[[permission]]
identifier = "grant-downloads"
description = "Save to the Downloads folder. Asked on the first download."

[[permission]]
identifier = "grant-shared-folder"
description = "Read a folder the person picks, per chat."

[[permission]]
identifier = "grant-shared-folder-write"
description = "Add and edit files in a shared folder, per folder and per chat. Never delete, rename or move."

[[permission]]
identifier = "grant-picked-file"
description = "One file the person picks in the system file picker."
