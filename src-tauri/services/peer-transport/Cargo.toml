[package]
name = "misty-peer-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
iroh = "=1.0.3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

[profile.release.build-override]
strip = false
