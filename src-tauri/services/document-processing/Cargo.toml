[package]
name = "misty-document-processing"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
calamine = "0.31"
csv = "1"
pdf-extract = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# This helper is a separate Cargo project and does not inherit the desktop profile.
[profile.dev]
debug = 1
incremental = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

[profile.release.build-override]
strip = false
