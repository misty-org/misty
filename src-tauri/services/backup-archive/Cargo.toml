[package]
name = "misty-backup-archive"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
cap-std = "3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tar = "0.4"
filetime = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
url = "2"
dirs = "6"
tempfile = "3"
zeroize = "1"
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
