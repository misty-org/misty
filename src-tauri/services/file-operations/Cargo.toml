[package]
name = "misty-file-operations"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
cap-std = "3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
