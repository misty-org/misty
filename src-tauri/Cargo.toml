[package]
name = "misty-native"
version = "0.1.0-beta.1"
description = "Misty native application shell"
authors = ["Misty Contributors"]
edition = "2021"
default-run = "misty-desktop"

[lib]
name = "misty_native"
crate-type = ["lib"]

[[bin]]
name = "misty-desktop"
path = "src/main.rs"

[[test]]
name = "webview_url"
path = "tests/webview_url.rs"
# AppKit and WKWebView must be exercised on the process's main thread.
harness = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
# Browser import: Chromium's AES-128-CBC cookie values, its PBKDF2-SHA1 key,
# Firefox's LZ4 search settings and Safari's property-list bookmarks.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha1_smol = "1"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
plist = { version = "1", default-features = false }
# A small local HTTP server: routing, state/path extractors and raw responses.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
async-stream = "0.3"
arboard = "3.6.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0.0"
hex = "0.4"
misty-credential-store = { path = "vendor/misty-credential-store" }
misty-browser-sync = { path = "crates/browser-sync" }
misty-agent-files = { path = "crates/agent-files" }
kiri = { path = "../kiri" }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Chrome Web Store package signatures (RSA and P-256); rustls already builds it.
ring = "0.17"
hkdf = "0.12"
# Signs the local HS256 access token (hkdf already depends on it).
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2.3.3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "2"
walkdir = "2.5"
image = { version = "0.25.10", default-features = false, features = ["hdr", "png", "pnm", "jpeg"] }
ed25519-dalek = "2"
# Devices (docs/design/devices/BRIEF.md): sealing the vault key to a newly
# approved device, the control channel socket, and LAN discovery.
x25519-dalek = { version = "2", features = ["static_secrets"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# Deflate through flate2's Rust backend only; zip's "deflate" also builds zopfli and zlib-rs.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
tauri-plugin-keystore = { path = "vendor/tauri-plugin-keystore" }
tauri-plugin-deep-link = "2"
percent-encoding = "2"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Microphone, system and per-process capture (github.com/kannachi323/audeeo,
# crates/audeeo-core). The vendored @audeeo/core packages pin the same commit.
audeeo-core = { git = "https://github.com/kannachi323/audeeo", rev = "2be9ad63e1c6c42c3ac42d641e79681e10531a97" }
xcap = "0.9"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "tga", "webp"] }
zune-psd = "0.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
# The vendored copy (see [patch.crates-io]); used for download progress and cancel.
wry = { version = "=0.55.1", default-features = false }
cocoa = "0.26"
core-graphics = "0.24"
core-foundation = "0.10"
objc = "0.2.7"
objc2 = "0.6.4"
# Reads another browser's cookie key from its own Keychain item on import.
security-framework = "3.7"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSImageRep", "NSEvent", "NSPasteboard", "NSResponder", "NSScrollView", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSUserDefaults", "NSUUID", "NSString", "NSURL", "NSURLResponse", "NSHTTPCookie", "NSDate"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKSecurityOrigin", "WKSnapshotConfiguration", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript", "WKNavigationResponse", "WKNavigationDelegate", "WKHTTPCookieStore", "WKWebsiteDataStore", "block2"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
# Confined helpers and agent commands (AppContainer and Job objects).
misty-windows-confine = { path = "crates/windows-confine" }
webview2-com = "0.38.2"
# The vendored copy (see [patch.crates-io]); used for download progress and cancel.
wry = { version = "=0.55.1", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.59", features = ["Wdk_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Local desktop builds: line-level debug info for Misty's own code, none for
# dependencies (they rarely need stepping into and dominate link time), and
# incremental builds so an edit recompiles only what changed. The incremental
# cache costs disk space under target/; Release builds are unaffected.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false

# Optimize the shipped host independently of its optional app packages.
# Keep unwinding: document processing still uses catch_unwind for recovery.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

# Build-time proc macros are never shipped; keep their loader symbols intact.
[profile.release.build-override]
strip = false

[dev-dependencies]
# Build fixtures/reference decoders without shipping these codecs in the macOS host.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "tga", "webp"] }

[patch.crates-io]
# Preserve the clipboard API while using AppKit instead of a bundled TIFF decoder on macOS.
arboard = { path = "vendor/arboard" }

# Honor focused(false) for background WebKit views on macOS, and let pages
# declare their own global `ipc` (see vendor/wry/MISTY-PATCH.md).
wry = { path = "vendor/wry" }

# Backport the upstream VariantStrIter soundness fix to Tauri's GTK3-compatible GLib.
glib = { path = "vendor/glib" }
