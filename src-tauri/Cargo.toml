[package]
name = "misty-native"
version = "0.1.0-beta.1"
description = "Misty native application shell"
authors = ["Misty Contributors"]
edition = "2021"
default-run = "misty-desktop"

[lib]
name = "misty_native"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "misty-desktop"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
async-stream = "0.3"
arboard = "3.6.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ciborium = "0.2"
dirs = "6.0.0"
hex = "0.4"
jsonwebtoken = "9"
keyring = "3.6"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
semver = "1"
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2.3.3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "2"
walkdir = "2.5"
image = { version = "0.25.10", default-features = false, features = ["hdr", "png", "pnm"] }
ed25519-dalek = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tauri-plugin-keystore = { path = "vendor/tauri-plugin-keystore" }
tauri-plugin-document-tree = { path = "vendor/tauri-plugin-document-tree" }
tauri-plugin-deep-link = "2"
percent-encoding = "2"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
cap-std = "4.0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
iroh = "1.0.3"
portable-pty = "0.9"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "tga", "webp"] }
zune-psd = "0.5.1"
tantivy = "0.25"
calamine = "0.31"
csv = "1"
pdf-extract = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
cocoa = "0.26"
core-graphics = "0.24"
objc = "0.2.7"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSImageRep", "NSEvent", "NSPasteboard", "NSResponder", "NSScrollView", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKSnapshotConfiguration", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "block2"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-drag = "2.1.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep local desktop builds useful for debugging without retaining Cargo's
# largest symbol and incremental caches. Release builds are unaffected.
[profile.dev]
debug = 1
incremental = false

# Optimize the shipped host independently of its optional app packages.
# Keep unwinding: document processing still uses catch_unwind for recovery.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

# Build-time proc macros are never shipped; keep their loader symbols intact.
[profile.release.build-override]
strip = false

[dev-dependencies]
# Build fixtures/reference decoders without shipping these codecs in the macOS host.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "tga", "webp"] }

[patch.crates-io]
# Preserve the clipboard API while using AppKit instead of a bundled TIFF decoder on macOS.
arboard = { path = "vendor/arboard" }
