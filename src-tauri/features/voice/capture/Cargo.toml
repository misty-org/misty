[package]
name = "voice_capture"
version = "0.1.0"
description = "On-demand audio capture: microphone, system and per-process audio as 16 kHz mono PCM16."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[lib]
name = "voice_capture"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

# Swift is only built on macOS hosts, so only they need the linker helper.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dev-dependencies]
serde_json = "1"
