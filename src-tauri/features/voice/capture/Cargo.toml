[package]
name = "voice_capture"
version = "0.1.0"
description = "On-demand audio capture: microphone, system and per-process audio as 16 kHz mono PCM16."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[lib]
name = "voice_capture"

[dependencies]
serde = { version = "1", features = ["derive"] }

# Apple's AVFAudio, AVFoundation, Core Audio and AppKit, called from Rust; the
# same versions as the app's, each linking its own framework.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-audio-types", "AVAudioBuffer", "AVAudioConverter", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "objc2", "block2", "dispatch2", "objc2-core-audio-types", "objc2-foundation", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSThread", "NSUUID", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

# PulseAudio's client library (MIT or Apache-2.0 bindings; libpulse itself is LGPL-2.1), which
# PipeWire also answers through pipewire-pulse.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"

[dev-dependencies]
serde_json = "1"
