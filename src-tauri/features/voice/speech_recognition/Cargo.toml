[package]
name = "voice_speech"
version = "0.1.0"
description = "Speech on this computer through open models, run in Misty's speech helper: hearing with voice activity detection, recorded files, and speaking in a voice. No key, nothing sent anywhere."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[lib]
name = "voice_speech"

[features]
default = ["client"]
client = ["dep:cpal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.15.3", optional = true }
