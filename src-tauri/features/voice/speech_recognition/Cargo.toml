[package]
name = "voice_speech"
version = "0.1.0"
description = "Speech on this computer through open models (sherpa-onnx): hearing with voice activity detection, recorded files, and speaking in a voice. No key, nothing sent anywhere."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[lib]
name = "voice_speech"

[dependencies]
serde = { version = "1", features = ["derive"] }
# sherpa-onnx (Apache-2.0): links its prebuilt static libraries, onnxruntime included.
sherpa-onnx = "2.0.2"
# Reading recorded files (MPL-2.0): the chat microphone's AAC in MP4, WAV, MP3, FLAC and Ogg.
symphonia = { version = "0.5.4", features = ["aac", "alac", "isomp4", "mp3"] }
# Playing a voice through the computer's output (Apache-2.0).
cpal = "0.15.3"
