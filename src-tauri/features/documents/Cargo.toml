[package]
name = "documents"
version = "0.1.0"
description = "Documents prepared for agents, parsed by a worker the operating system confines"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "documents"
path = "lib.rs"

[dependencies]
file_access = { path = "../file_access" }
sandbox = { path = "../sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
