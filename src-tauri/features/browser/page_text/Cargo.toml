[package]
name = "page_text"
version = "0.1.0"
description = "Readable text from a fetched page, shared by Misty's agent runtime and its confined worker"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[lib]
name = "page_text"

[dependencies]
html5ever = "0.38"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
