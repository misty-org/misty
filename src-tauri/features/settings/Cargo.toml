[package]
name = "settings"
version = "0.1.0"
description = "What this device remembers as settings and shortcuts, kept in misty.db"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "settings"
path = "lib.rs"

[dependencies]
database = { path = "../database" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ctor = "0.8"
file_access = { path = "../file_access", features = ["test-fixtures"] }
