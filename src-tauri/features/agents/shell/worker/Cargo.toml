[package]
name = "shell_worker"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "misty-agent-shell"
path = "src/main.rs"

[dependencies]
brush-builtins = "0.2"
brush-core = "0.5"
findutils = "0.11"
flate2 = "1"
sed = { version = "0.3", default-features = false }
tar = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
uu_grep = "0.2"
uucore = "0.12"
uucore_for_grep = { package = "uucore", version = "0.10" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uu_base64 = "0.12"
uu_basename = "0.12"
uu_cat = "0.12"
uu_comm = "0.12"
uu_cp = "0.12"
uu_csplit = "0.12"
uu_cut = "0.12"
uu_date = "0.12"
uu_dirname = "0.12"
uu_du = "0.12"
uu_env = "0.12"
uu_expand = "0.12"
uu_expr = "0.12"
uu_fmt = "0.12"
uu_fold = "0.12"
uu_cksum = "0.12"
uu_head = "0.12"
uu_join = "0.12"
uu_ln = "0.12"
uu_ls = "0.12"
uu_mkdir = "0.12"
uu_mktemp = "0.12"
uu_mv = "0.12"
uu_nl = "0.12"
uu_od = "0.12"
uu_paste = "0.12"
uu_readlink = "0.12"
uu_realpath = "0.12"
uu_rm = "0.12"
uu_rmdir = "0.12"
uu_seq = "0.12"
uu_shuf = "0.12"
uu_sleep = "0.12"
uu_sort = "0.12"
uu_split = "0.12"
uu_tac = "0.12"
uu_tail = "0.12"
uu_tee = "0.12"
uu_touch = "0.12"
uu_tr = "0.12"
uu_truncate = "0.12"
uu_uniq = "0.12"
uu_wc = "0.12"

# This helper is a separate Cargo project and does not inherit the desktop profile. It's kept small:
# a smaller binary starts and is checked faster.
[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
incremental = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
panic = "abort"

[profile.release.build-override]
strip = false
