# Every crate under this folder builds into the one `target/` here. Without this, each of the
# nested crates (settings, database, documents, ...) built into its own `target/` and recompiled
# tauri and the other shared dependencies, which cost tens of gigabytes. The environment variable
# CARGO_TARGET_DIR still wins, which the worker builds in `build.rs` rely on; they stay inside
# this `target/`. Don't point anything else at another folder.
[build]
target-dir = "target"
