[package]
name = "misty-credential-store"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
libc = "0.2"
serde_json = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }
