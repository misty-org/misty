[package]
name = "misty-windows-confine"
version = "0.1.0"
edition = "2021"
publish = false

# Confined processes on Windows: an AppContainer with no capabilities, a Job
# object that bounds and ends the process tree, and only chosen handles and
# environment variables passed on. The counterpart of sandbox-exec on macOS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
