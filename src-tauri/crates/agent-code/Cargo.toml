[package]
name = "misty-agent-code"
version = "0.1.0"
edition = "2021"
publish = false

# Code projects (docs/plans/agent-code-projects.md): file tools, the sandboxed
# command runner, undo checkpoints, the package proxy and the preview server.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
# Git in Misty (docs/plans/agent-git-projects.md): libgit2 runs no hooks or
# repository-configured commands. No network features: transfers go through
# GitHub's API via Composio.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-std"] }
