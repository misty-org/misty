name: CLI and desktop build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo run --manifest-path cli/Cargo.toml --locked -- setup desktop
      - run: cargo run --manifest-path cli/Cargo.toml --locked -- check cli
      - run: npm run build:desktop
