name: Server release

# Builds the API and agent runtime images for a server-vX.Y.Z tag, pushes them
# to GHCR, proves the production stack boots its databases and runtime with
# them, and prints the digests for the VPS's .env/prod/runtime.env. Deploying
# stays manual: paste the digests, then run `misty server prod up`.

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/misty-api
  AGENT_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/misty-agent-runtime

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and push images
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      agent-runtime: ${{ steps.agent-runtime.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then version="0.0.0-${GITHUB_SHA::12}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No "latest" tag: production deploys by digest only.
      - name: Build the API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the agent runtime image
        id: agent-runtime
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/apps/agent-runtime/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AGENT_RUNTIME_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.AGENT_RUNTIME_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-runtime
          cache-to: type=gha,scope=agent-runtime,mode=max

  smoke:
    name: Boot the production stack
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: server
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Migrations, grants, the workflow database and the agent runtime run
      # exactly as on the VPS. The API itself needs production secrets, so its
      # image is exercised here through the migration job it shares.
      - name: Start databases and the agent runtime
        env:
          MISTY_API_IMAGE: ${{ env.API_IMAGE }}@${{ needs.build.outputs.api }}
          MISTY_AGENT_RUNTIME_IMAGE: ${{ env.AGENT_RUNTIME_IMAGE }}@${{ needs.build.outputs.agent-runtime }}
          DB_NAME: misty_server
          DB_USER: misty_app
          DB_MIGRATION_USER: misty
        run: |
          export DB_PASSWORD="$(openssl rand -hex 24)" DB_MIGRATION_PASSWORD="$(openssl rand -hex 24)"
          export AGENT_RUNTIME_DB_PASSWORD="$(openssl rand -hex 24)"
          export MISTY_AGENT_RUNTIME_CONTROL_SECRET="$(openssl rand -base64 32)"
          docker compose -f compose.prod.yml up --detach agent-runtime
          container="$(docker compose -f compose.prod.yml ps -q agent-runtime)"
          for _ in $(seq 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker compose -f compose.prod.yml logs --no-color
          echo "agent runtime did not become healthy (last status: $status)" >&2
          exit 1

  report:
    name: Deployment values
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Write the image digests to the run summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
          API: ${{ env.API_IMAGE }}@${{ needs.build.outputs.api }}
          AGENT_RUNTIME: ${{ env.AGENT_RUNTIME_IMAGE }}@${{ needs.build.outputs.agent-runtime }}
        run: |
          {
            echo "## Misty server $VERSION"
            echo
            echo "Paste into \`server/.env/prod/runtime.env\` on the VPS, then run \`misty server prod up\`:"
            echo
            echo '```dotenv'
            echo "MISTY_API_IMAGE=$API"
            echo "MISTY_AGENT_RUNTIME_IMAGE=$AGENT_RUNTIME"
            echo '```'
            echo
            echo "Roll back by pasting a previous release's digests."
          } >> "$GITHUB_STEP_SUMMARY"
