name: Public SDK packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:packed
      - run: |
          mkdir artifacts
          npm pack --workspace @misty/contracts --pack-destination artifacts
          npm pack --workspace @misty/sdk --pack-destination artifacts
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-0.1.0
          path: artifacts/*
