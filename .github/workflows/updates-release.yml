name: Promote prepared beta
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared Misty beta tag
        required: true
        type: string
      phase:
        description: Publish immutable assets first, then feeds after verification
        required: true
        type: choice
        options: [assets, feeds]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: misty-updates-promotion
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify and stage the prepared site without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PHASE: ${{ inputs.phase }}
        run: node cli/tasks/release/promote-beta.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/update-site
          # The staged site includes .nojekyll, which v4+ drops unless asked.
          include-hidden-files: true
  deploy:
    needs: site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
