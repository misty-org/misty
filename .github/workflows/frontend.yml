name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, lint, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same steps as `npm run check`, split so a failure names its stage.
      - run: npm run check:format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:dev-navigation
      - run: npm run test:tasks
      - run: npm run audit:production
