name: Native desktop checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-desktop:
    name: ${{ matrix.os }} native WebView
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      MISTY_PUBLIC_API_URL: https://mistysys.com/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libappindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install the macOS backup integration prerequisite
        if: runner.os == 'macOS'
        run: brew install restic

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: native-desktop

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check browser frontend
        run: npm run typecheck

      - name: Test browser frontend
        run: npm test -- src/features/browser/workspace/BrowserWorkspace.test.ts src/features/agents/worker.test.ts src/features/agents/companion src/features/agents/localExecution.test.ts src/features/agents/voice src/features/agents/components/agentCloudAvatars.test.ts src/features/agents/components/AgentWorkspaceConversation.test.tsx src/app/main.test.ts

      - name: Compile native desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Test native desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build packaged companion frontend
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm run build:desktop

      - name: Write acceptance packaging configuration
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: node -e "require('node:fs').writeFileSync('cursor-acceptance.conf.json', JSON.stringify({build:{beforeBuildCommand:''},bundle:{createUpdaterArtifacts:false}}))"

      - name: Package unsigned macOS acceptance app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --debug --bundles app --no-sign --config "${{ github.workspace }}/cursor-acceptance.conf.json"

      - name: Package unsigned Windows acceptance app
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --bundles nsis --no-sign --config "${{ github.workspace }}/cursor-acceptance.conf.json"

      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/debug/bundle/macos/Misty.app src-tauri/target/debug/bundle/macos/Misty-acceptance.zip

      - name: Preserve desktop acceptance package
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-acceptance-${{ runner.os }}
          path: |
            src-tauri/target/debug/bundle/**/*.zip
            src-tauri/target/debug/bundle/**/*.exe
          retention-days: 7
