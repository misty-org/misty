name: Notarize friend installer
run-name: Notarize ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Temporary draft release containing the signed installer
        required: true
        type: string
      asset_name:
        description: Signed DMG filename
        required: true
        type: string
      sha256:
        description: Expected SHA-256 before notarization
        required: true
        type: string
permissions:
  contents: read
jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download and verify exact signed installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^friend-macos-[a-zA-Z0-9-]+$ ]]
          [[ "$ASSET_NAME" =~ ^[a-zA-Z0-9_.-]+[.]dmg$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/output"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/input"
          dmg="$RUNNER_TEMP/input/$ASSET_NAME"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          codesign --verify --strict --verbose=2 "$dmg"
          codesign -d -r- "$dmg" 2>&1 | tee "$RUNNER_TEMP/signature.txt"
          grep -F 'certificate leaf[subject.OU] = "7D6BVN4W87"' "$RUNNER_TEMP/signature.txt"
          printf 'DMG_PATH=%s\nASSET_NAME=%s\n' "$dmg" "$ASSET_NAME" >> "$GITHUB_ENV"
      - name: Notarize with Apple and staple ticket
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status="$(jq -r .status "$RUNNER_TEMP/notary.json")"
          if [[ "$status" != Accepted ]]; then
            submission="$(jq -r .id "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$submission" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -t open --context context:primary-signature --verbose=2 "$DMG_PATH"
          cp "$DMG_PATH" "$RUNNER_TEMP/output/$ASSET_NAME"
          cp "$RUNNER_TEMP/notary.json" "$RUNNER_TEMP/output/notarization.json"
          cd "$RUNNER_TEMP/output"
          shasum -a 256 "$ASSET_NAME" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: misty-notarized-apple-silicon
          path: ${{ runner.temp }}/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
