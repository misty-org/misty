name: Tests

# CI runs only the code tests. Formatting, types, lint, audits, builds, and native
# checks run locally; see "Checks" in the README.

on:
  pull_request:
  push:
    branches: [main]
  # server-release.yml gates image publishing on these same tests.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb # same image as compose.prod.yml
        env:
          POSTGRES_USER: misty
          POSTGRES_PASSWORD: misty-test-password
          POSTGRES_DB: misty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U misty -d misty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: misty
      DB_PASSWORD: misty-test-password
      DB_NAME: misty_test
      DB_SSLMODE: disable
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_USER: misty
      TEST_DB_PASSWORD: misty-test-password
      TEST_DB_NAME: misty_test
      TEST_DB_SSLMODE: disable
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret_123
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
          cache-dependency-path: server/go.sum
      - name: Migrate the test database
        run: |
          go install -tags="no_clickhouse no_libsql no_mssql no_mysql no_sqlite3 no_vertica no_ydb" github.com/pressly/goose/v3/cmd/goose@v3.27.3
          ./scripts/goose.sh up
      - name: Provision the application role for row-level security tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: misty
          PGPASSWORD: misty-test-password
          PGDATABASE: misty_test
          MISTY_APP_DB_USER: misty_app
          MISTY_APP_DB_PASSWORD: misty-app-test-password
        run: ./scripts/docker/postgres-grant-app-role.sh
      - name: Go tests
        run: go test -p 1 ./... -count=1
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/apps/journal-collab/.nvmrc
          cache: npm
          cache-dependency-path: |
            server/apps/agent-runtime/package-lock.json
            server/apps/journal-collab/package-lock.json
      - name: Agent runtime tests
        working-directory: server/apps/agent-runtime
        run: |
          npm ci
          npm test
      - name: Journal collaboration tests
        working-directory: server/apps/journal-collab
        run: |
          npm ci
          npm test
          npm run test:runtime
