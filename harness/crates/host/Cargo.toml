[package]
name = "misty_harness_host"
version = "0.1.0"
description = "A bare window with the system webview that runs the agent page runtime in its own script world, with no CDP and no Playwright"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.80"

[[bin]]
name = "harness-host"
path = "src/main.rs"

[dependencies]
misty_page_runtime = { path = "../page-runtime" }
serde_json = "1"
# The same webview and window libraries Tauri builds on, at Misty's version.
tao = "0.35"
wry = "=0.55.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentWorld", "WKFrameInfo", "WKWebView"] }
