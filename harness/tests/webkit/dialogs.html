<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
  <h1>Dialogs</h1>
  <button id="delete" onclick="document.getElementById('out').textContent = confirm('Delete the file?') ? 'deleted' : 'kept'">Remove file</button>
  <button id="name" onclick="document.getElementById('out').textContent = 'name:' + prompt('Your name?', 'nobody')">Set name</button>
  <button id="note" onclick="alert('Saved'); document.getElementById('out').textContent = 'alerted'">Show note</button>
  <label for="file">Attach a file</label>
  <input type="file" id="file" onchange="document.getElementById('out').textContent = 'file:' + this.files[0].name">
  <button id="upload" onclick="document.getElementById('file').click()">Upload</button>
  <p id="out">idle</p>
</body>
</html>
