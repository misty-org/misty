<!doctype html>
<html><head><meta charset="utf-8"><title>Pictures</title>
<style>
  body { margin: 0; }
  #top { height: 600px; background: rgb(255, 0, 0); }
  #badge { position: absolute; left: 100px; top: 100px; width: 120px; height: 60px; background: rgb(0, 0, 255); }
  #bottom { height: 1400px; background: rgb(0, 255, 0); }
</style></head>
<body>
  <div id="top"></div>
  <button id="badge" style="border:0">Badge</button>
  <div id="bottom"></div>
  <script>
    window.colorAt = (url, x, y) => new Promise((resolve) => {
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.width; canvas.height = image.height;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        const [r, g, b] = context.getImageData(x, y, 1, 1).data;
        resolve(`${r},${g},${b} ${image.width}x${image.height}`);
      };
      image.src = url;
    });
  </script>
</body></html>
