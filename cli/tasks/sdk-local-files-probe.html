<!doctype html><html><head><meta charset="utf-8"><title>Files native verification</title><link rel="stylesheet" href="/src/styles/styles.css"><style>html,body,#host{margin:0;height:100%;background:#111;color:#eee}</style></head><body><div id="host"></div><script>window.addEventListener('error',e=>window.__TAURI_INTERNALS__?.invoke('sdk_probe_complete',{nonce:new URLSearchParams(location.search).get('nonce'),success:false,message:'Module failure: '+e.message}));window.addEventListener('unhandledrejection',e=>window.__TAURI_INTERNALS__?.invoke('sdk_probe_complete',{nonce:new URLSearchParams(location.search).get('nonce'),success:false,message:'Unhandled: '+String(e.reason)}));</script><script type="module" src="./sdk-local-files-probe.tsx"></script></body></html>
