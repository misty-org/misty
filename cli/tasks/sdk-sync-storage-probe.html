<!doctype html>
<meta charset="utf-8">
<title>Native sync storage regression probe</title>
<pre id="result">Testing native website storage…</pre>
<script type="module">
  import { invoke } from "@tauri-apps/api/core";
  const nonce = new URLSearchParams(location.search).get("nonce");
  let success = false;
  let message;
  try {
    message = await invoke("sdk_probe_sync_storage", { nonce });
    success = true;
  } catch (error) {
    message = `FAIL: ${String(error)}`;
  }
  document.getElementById("result").textContent = message;
  await invoke("sdk_probe_complete", { nonce, success, message });
</script>
