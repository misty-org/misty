<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Agent file transfer fixture</title>
<style>body{font:16px system-ui;padding:48px;background:#131313;color:#e0e0e0}a,input{display:block;margin:24px 0;color:#a0c4d4}button{padding:12px 20px}</style>
<h1>Native agent file transfer test</h1>
<p>Synthetic image and PDF; this fixture does not represent a completed catalog workflow.</p>
<a id="image" download="mockup.png">Download test image</a>
<a id="pdf" download="catalog.pdf">Download test catalog</a>
<button id="popup">Download popup catalog</button>
<button id="attachment">Download attachment catalog</button>
<input type="file" aria-label="Upload task file">
<p id="result">No file selected</p>
<script>
 const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl6lWUAAAAASUVORK5CYII='), c=>c.charCodeAt(0));
 document.querySelector('#image').href=URL.createObjectURL(new Blob([png],{type:'image/png'}));
 document.querySelector('#pdf').href=URL.createObjectURL(new Blob(['%PDF-1.7\n% Native transfer fixture\n%%EOF'],{type:'application/pdf'}));
 document.querySelector('#popup').onclick=()=>window.open(location.pathname+'?popupDownload=1','_blank');
 document.querySelector('#attachment').onclick=()=>{const frame=document.createElement('iframe');frame.hidden=true;frame.src='/cli/tasks/sdk-browser-download.pdf';document.body.append(frame);};
 if(new URLSearchParams(location.search).has('popupDownload')) setTimeout(()=>document.querySelector('#pdf').click(),100);
 document.querySelector('input').addEventListener('change',async event=>{
  const file=event.target.files[0];
  const bytes=await file.arrayBuffer();
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
  document.querySelector('#result').textContent=JSON.stringify({name:file.name,size:file.size,type:file.type,sha256:hash});
 });
 document.body.dataset.ready='true';
</script></html>
