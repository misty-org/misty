<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Misty onboarding — animation samples</title>
<style>
  :root { --bg:oklch(0.16 0.006 285.823); --fg:oklch(0.985 0 0); --muted:oklch(0.705 0.015 286.067); --line:#2a2a2a; --btn-bg:oklch(0.985 0 0); --btn-fg:oklch(0.16 0.006 285.823); --blend:lighter; --sprite:255; }
  :root[data-theme="light"] { --bg:oklch(1 0 0); --fg:oklch(0.141 0.005 285.823); --muted:oklch(0.45 0.016 285.938); --line:#d6d6d2; --btn-bg:oklch(0.141 0.005 285.823); --btn-fg:oklch(1 0 0); --blend:source-over; --sprite:20; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; transition:background .4s,color .4s; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .bar { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:10px; background:color-mix(in srgb,var(--bg) 70%,transparent); backdrop-filter:blur(8px); }
  .bar button { all:unset; cursor:pointer; padding:5px 12px; font-size:12px; border-radius:7px; color:var(--muted); }
  .bar button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
  .bar .sep { width:1px; background:var(--line); margin:3px 4px; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none; z-index:2; }
  .copy { max-width:1100px; padding:0 24px; display:flex; flex-direction:column; align-items:center; }
  .copy { position:relative; }
  .copy::before { content:''; position:absolute; inset:-18% -25%; z-index:-1; pointer-events:none; opacity:0; transition:opacity 1.4s ease; background:radial-gradient(closest-side, color-mix(in srgb,var(--bg) 78%,transparent) 30%, transparent); }
  .copy.in::before { opacity:1; }
  .copy.out::before { opacity:0; }
  .copy { opacity:0; transform:scale(.4); transform-origin:50% 50%; }
  .copy.in { animation:hero-zoom-in 1s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes hero-zoom-in { from { opacity:0; transform:scale(.4); } 55% { opacity:1; } to { opacity:1; transform:scale(1); } }
  @keyframes hero-zoom-out { from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(1.35); } }
  .ctas { margin-top:2.25rem; }
  .copy.out { animation:hero-zoom-out .8s ease-in forwards; }
  .copy.cloud.in { animation:hero-emerge 2.2s cubic-bezier(.2,.9,.25,1) forwards; }
  .copy.cloud.out { animation:hero-dive 1.5s cubic-bezier(.5,0,.85,.4) forwards; }
  @keyframes hero-emerge { from { opacity:0; transform:scale(.22); filter:blur(14px); } 45% { opacity:1; } 70% { filter:blur(0); } to { opacity:1; transform:scale(1); filter:blur(0); } }
  @keyframes hero-dive { from { opacity:1; transform:scale(1); filter:blur(0); } to { opacity:0; transform:scale(2.4); filter:blur(18px); } }
  .copy.warp, .copy.warp.in, .copy.warp.out { animation:none; }   /* position/scale are driven by the warp itself */
  @keyframes hero-fade-up { to { opacity:1; transform:none; } }
  .hero-title { font-size:clamp(2.65rem,7.5vw,7.25rem); font-weight:600; line-height:.98; letter-spacing:-.05em; text-shadow:0 0 40px var(--bg); }
  .hero-title .lead { display:block; color:var(--muted); }
  .hero-title .word { margin-top:.5rem; display:inline-grid; grid-template-areas:'word'; }
  .hero-title .word > * { grid-area:word; white-space:nowrap; }
  .hero-title .ghostw { visibility:hidden; }
  .cursor { display:inline-block; width:.055em; height:.82em; margin-left:.1em; background:currentColor; vertical-align:-.05em; }
  .cursor.blink { animation:blink 900ms steps(1,end) infinite; }
  @keyframes blink { 0%,48% {opacity:1} 49%,100% {opacity:0} }
  .desc { max-width:36rem; margin-top:1.5rem; color:var(--muted); font-size:1.125rem; line-height:1.625; text-shadow:0 0 18px var(--bg),0 0 6px var(--bg); }
  .ctas { margin-top:2rem; display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
  .go, .ghost { pointer-events:auto; all:unset; cursor:pointer; height:44px; padding:0 24px; border-radius:999px; font-size:14px; font-weight:500; display:inline-flex; align-items:center; transition:opacity .2s; }
  .go { background:var(--btn-bg); color:var(--btn-fg); }
  .ghost { border:1px solid color-mix(in srgb,var(--fg) 30%,transparent); color:var(--fg); background:transparent; }
  .go:hover, .ghost:hover { opacity:.85; } .go:focus-visible, .ghost:focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
  .go, .ghost { pointer-events:auto; }
  .after { position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px; opacity:0; transition:opacity .8s; z-index:1; text-align:center; }
  .after.in { opacity:1; }
  .hint { position:fixed; inset:0; display:grid; place-items:center; z-index:2; pointer-events:none; color:var(--muted); font-size:13px; letter-spacing:.01em; opacity:0; transition:opacity 1.2s ease; }
  .hint.in { opacity:1; animation:hint-breathe 3.2s ease-in-out 1.2s infinite; }
  @keyframes hint-breathe { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  .note { position:fixed; bottom:14px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" role="toolbar" aria-label="Samples">
  <button data-v="cloud" aria-pressed="true">D · Cloudwarp</button>
  <button data-v="galaxy" aria-pressed="false">A · Galaxy</button>
  <button data-v="mist" aria-pressed="false">B · Mist bloom</button>
  <button data-v="warp" aria-pressed="false">C · Warp</button>
  <span class="sep"></span>
  <button id="replay">Replay</button>
  <button id="theme">Light</button>
  <button id="sound" aria-pressed="true">Sound</button>
</div>
<div class="stage"><div class="copy" id="copy">
  <h1 class="hero-title" id="title" aria-label="Welcome to Misty"><span aria-hidden="true"><span class="lead">Welcome to</span><span class="word"><span>Misty</span></span></span></h1>
  <div class="ctas"><button class="go" id="go">Sign in</button><button class="ghost" id="skip">Create account</button></div>
</div></div>
<div class="after" id="after">Next: the sign-in screen.<br>Press Replay to run it again.</div>
<div class="hint" id="hint" aria-live="polite">Click anywhere to begin</div>
<div class="note" id="note"></div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const title = document.getElementById('title'), copy = document.getElementById('copy'), after = document.getElementById('after');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, DPR, variant = 'cloud', t0 = 0, exitAt = null, sprite, spriteTone = -1;
const rnd = (a=0,b=1)=>a+Math.random()*(b-a);
const gauss = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
const easeOutExpo = x => x>=1?1:1-Math.pow(2,-10*x);
const easeOutCubic = x => 1-Math.pow(1-x,3);
const clamp01 = x => Math.max(0,Math.min(1,x));
const smooth = x => x*x*(3-2*x);
const notes = {
  cloud:'D · You accelerate into a cloud bank, push through about four seconds of thick mist, and coast out into clear air as the title emerges from the haze. Quiet wind follows the speed; Sign in dives back into the clouds with a softer whoosh (toggle with Sound). The intro waits for a first click so the sound can start with it.',
  galaxy:'A · A bright flash at the centre, then a spiral galaxy of mist-dust blooms outward and keeps turning slowly. Move the mouse to tilt it.',
  mist:'B · Soft fog expands from a point and breathes. The calmest option, closest to the name “Misty”.',
  warp:'C · A fast burst of light streaks that decelerates into a drifting field. The most dramatic option.'
};

function tone(){ return getComputedStyle(document.documentElement).getPropertyValue('--sprite').trim(); }
function makeSprite(){
  const v = tone(); if (+v === spriteTone) return; spriteTone = +v;
  const s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${v},${v},${v},1)`); gr.addColorStop(.35,`rgba(${v},${v},${v},.35)`); gr.addColorStop(1,`rgba(${v},${v},${v},0)`);
  g.fillStyle = gr; g.fillRect(0,0,128,128); sprite = s; buildClouds();
}
let clouds = [], fb, fbx;
function noise2(x,y,seed){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const h=(i,j)=>{ let n=Math.imul(i,374761393)+Math.imul(j,668265263)+seed; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967295; };
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;
}
const fbm=(x,y,s)=>{ let a=.5,f=1,t=0; for(let o=0;o<5;o++){ t+=a*noise2(x*f,y*f,s+o*17); f*=2.03; a*=.5; } return t; };
/* Smoke: domain-warped noise gives swirling filaments; ridged noise makes them wispy, not round. */
function buildClouds(){
  const light = document.documentElement.dataset.theme==='light';
  const base = light ? 196 : 170, N = 224;
  clouds = [];
  for (let n=0;n<6;n++){
    const c = document.createElement('canvas'); c.width = c.height = N;
    const g = c.getContext('2d'), img = g.createImageData(N,N), seed = Math.floor(rnd(1,9999));
    const d = new Float32Array(N*N);
    // billowy density: a lumpy ellipse with a flatter base, so each puff has a defined cumulus edge
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      const px=(x/N-.5)*2, py=(y/N-.5)*2;
      const ry = py>0 ? 0.55 : 0.8, e = Math.hypot(px/.92, py/ry);
      const qx=fbm(px*1.7+3,py*1.7,seed), qy=fbm(px*1.7,py*1.7+9,seed+5);
      const base = fbm(px*2.4+qx*1.4, py*2.4+qy*1.4, seed+11);
      d[y*N+x] = base*0.95 + (1-e)*0.95;
    }
    const sm=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      const i=y*N+x, dv=d[i];
      const al = sm(.5,.98,dv)*.5;          // translucent: you can see through the thinner edges
      // light from the upper left: surfaces rising toward +x,+y are lit; deep interior is shadowed
      const hx = d[y*N+Math.min(N-1,x+3)]-d[y*N+Math.max(0,x-3)];
      const hy = d[Math.min(N-1,y+3)*N+x]-d[Math.max(0,y-3)*N+x];
      let v = base + (hx+hy)*(light?120:150) - sm(.85,1.35,dv)*(light?70:62) + (light?0:12);
      v = Math.max(light?118:88, Math.min(light?246:226, v));
      const k=i*4; img.data[k]=img.data[k+1]=img.data[k+2]=v; img.data[k+3]=al*255;
    }
    g.putImageData(img,0,0); clouds.push(c);
  }
}
function resize(){
  DPR = Math.min(devicePixelRatio||1,2); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', ()=>{ resize(); build(); });

let mx = 0, my = 0, smx = 0, smy = 0;
addEventListener('pointermove', e=>{ mx = e.clientX/W-.5; my = e.clientY/H-.5; });

/* ---------- variant state ---------- */
let P = [];
// Clouds spawn around, not on, the view's centre, so the middle opens up once the rush slows.
function place(c, open){
  do { c.x=rnd(-2.3,2.3); c.y=rnd(-1.45,1.45); } while (open && Math.hypot(c.x/.9,c.y/.55)<1);
}
function build(){
  const R = Math.min(W,H)*0.46, n = Math.round(Math.min(1800, W*H/1100));
  P = [];
  if (variant==='galaxy'){
    for (let i=0;i<n;i++){
      const arm = i%2, r = Math.pow(Math.random(),1.35)*R*1.25;
      const ang = arm*Math.PI + r/R*3.1 + gauss()*(.12+.5*(1-r/R)*(1-r/R)*0.0+ .35*(1-Math.min(1,r/R))*0.0) + gauss()*(.2+.55*r/R) + (Math.random()<.3 ? rnd(0,6.28) : 0);
      P.push({r, ang, size:rnd(.6,2.4)*(r<R*.2?1.4:1), a:rnd(.25,.9), w:1/(.35+r/R*1.1), jy:gauss()*R*.035});
    }
  } else if (variant==='cloud'){
    const cn = Math.round(Math.min(80, W*H/17000));
    for (let i=0;i<cn;i++){
      const cl = {z:rnd(.12,1.6), puffs:[]}; place(cl);
      for (let j=0;j<4;j++) cl.puffs.push({dx:gauss()*.24, dy:gauss()*.1, dz:gauss()*.05, s:rnd(.34,.7), a:rnd(.65,1), ph:rnd(0,6.28), i:Math.floor(rnd(0,6))});
      P.push(cl);
    }
  } else if (variant==='mist'){
    const m = Math.round(Math.min(70,W*H/20000));
    for (let i=0;i<m;i++) P.push({ang:rnd(0,6.283), d:Math.pow(Math.random(),.7)*R*1.15, s:rnd(.18,.5)*Math.min(W,H), a:rnd(.035,.09), sp:rnd(.08,.22), ph:rnd(0,6.28), ph2:rnd(0,6.28), wob:rnd(14,46)});
    for (let i=0;i<Math.round(n*.22);i++) P.push({dust:true, ang:rnd(0,6.283), d:Math.pow(Math.random(),.6)*R*1.3, s:rnd(1,3), a:rnd(.15,.55), sp:rnd(.1,.3), ph:rnd(0,6.28)});
  } else {
    for (let i=0;i<Math.round(n*.55);i++) P.push({x:rnd(-1,1), y:rnd(-1,1), z:rnd(.02,1), a:rnd(.4,1)});
  }
}

/* ---------- drawing ---------- */
function blob(x,y,size,alpha){ ctx.globalAlpha = Math.max(0,Math.min(1,alpha)); ctx.drawImage(sprite, x-size/2, y-size/2, size, size); }

function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) return;
  makeSprite();
  const t = reduce ? 99 : waiting ? 0 : (now - t0)/1000;     // held at the start, drifting at cruise, until the first click
  const ex = exitAt==null ? 0 : clamp01((now-exitAt)/1000/(variant==='cloud'?1.9:1.1));
  smx += (mx-smx)*.04; smy += (my-smy)*.04;
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation = getComputedStyle(document.documentElement).getPropertyValue('--blend').trim();
  const cx = W/2, cy = H/2, R = Math.min(W,H)*.46, fade = 1-ex;

  if (variant==='cloud'){
    const lightMode = document.documentElement.dataset.theme==='light';
    const dt = Math.min(.05, (now-(frame.last||now))/1000); frame.last = now;
    // Speed profile: ease up to full speed over ~0.7s, hold briefly, then a long deceleration into a slow drift.
    // The exit dives back in, accelerating until the screen is all mist.
    const PEAK = 2.4, CRUISE = .07;
    const accel = smooth(clamp01(t/.7)), decay = Math.exp(-Math.max(0,t-1.3)/1.05);
    const v = reduce ? 0 : CRUISE + PEAK*accel*decay + ex*ex*3.2;
    const rush = clamp01((v-CRUISE)/PEAK);
    const sc = Math.max(W,H)*.5;
    ctx.globalCompositeOperation = 'source-over';
    // Warp: re-draw last frame zoomed outward from the centre, so the mist smears past you while you're moving fast.
    if (!fb || fb.width!==cv.width || fb.height!==cv.height){ fb=document.createElement('canvas'); fb.width=cv.width; fb.height=cv.height; fbx=fb.getContext('2d'); }
    const fbA = .62*Math.pow(rush,.8)*smooth(clamp01(t/.5));
    if (fbA>.01){
      const zoom = 1 + (.006+.05*rush)*dt*60, fw = cv.width*zoom, fh = cv.height*zoom;
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = fbA; ctx.drawImage(fb,(cv.width-fw)/2,(cv.height-fh)/2,fw,fh); ctx.restore();
    }
    for (const c of P){
      c.z -= v*dt;
      if (c.z < .06){ c.z += 1.5; place(c, rush<.5); }
    }
    P.sort((a,b)=>b.z-a.z);                                    // far to near
    const baseA = lightMode ? .16 : .055;
    for (const c of P){
      for (const q of c.puffs){
        const z = c.z+q.dz; if (z<.06) continue;
        // fade in from the distance; near clouds stay visible until they wash over the camera
        const k = 1/z, far = clamp01((1.6-z)/.45), near = smooth(clamp01((z-.06)/.32));
        const x = cx + (c.x+q.dx+smx*.3)*k*sc*.45, y = cy + (c.y+q.dy+smy*.3)*k*sc*.45;
        const w = q.s*k*sc*(1+.03*Math.sin(t*.5+q.ph))*1.7, h = w*.82;
        const al = q.a*baseA*(1-.55*fbA)*far*near;
        // stay upright, but stretch along the line of flight so the rush reads as speed
        const dx = x-cx, dy = y-cy, ang = Math.atan2(dy,dx);
        const stretch = 1 + .7*rush*clamp01(Math.hypot(dx,dy)/(R*1.2));
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(stretch,1); ctx.rotate(-ang);
        ctx.globalAlpha = Math.min(1,al); ctx.drawImage(clouds[q.i],-w/2,-h/2,w,h); ctx.restore();
      }
    }
    ctx.globalAlpha = 1; fbx.clearRect(0,0,fb.width,fb.height); fbx.drawImage(cv,0,0);
    // Inside the cloud: a veil, thicker at the edges like a tunnel, that thins as you break into clear air.
    // Drawn after the trail capture so it never compounds.
    const veil = Math.pow(rush,1.15)*(lightMode?.62:.5);
    if (veil>.005){
      const g = lightMode ? 206 : 92, rad = Math.hypot(W,H)/2;
      const gr = ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
      gr.addColorStop(0,`rgba(${g},${g},${g},${veil*.35})`); gr.addColorStop(.55,`rgba(${g},${g},${g},${veil*.7})`); gr.addColorStop(1,`rgba(${g},${g},${g},${veil})`);
      ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
    }
  } else if (variant==='galaxy'){
    const e = easeOutExpo(clamp01(t/2.8)), tilt = .62 + smy*.25, rot = smx*.5;
    const flash = Math.exp(-t*.7)*.22*clamp01(t/1.2);
    // core glow + initial flash
    blob(cx,cy, R*(.9+flash*3.2+ex*3), (.16+flash*.9)*fade);
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    for (const p of P){
      const rr = p.r*e*(1+ex*2.4);
      const a = p.ang + (1-e)*5.2 + p.w*t*.11 + ex*.9;
      let x = Math.cos(a)*rr, y = Math.sin(a)*rr*tilt + p.jy*e;
      const X = cx + x*cosR - y*sinR, Y = cy + x*sinR + y*cosR;
      const tw = .75+.25*Math.sin(t*1.7+p.ang*9);
      const sz = p.size*(1+ (1-e)*1.6)*5 ;
      blob(X,Y, sz, p.a*tw*clamp01(e*1.6)*fade*(rr< R*.08 ? .7:1));
    }
  } else if (variant==='mist'){
    const e = easeOutCubic(clamp01(t/3.4));
    blob(cx,cy,R*(.8+ex*2.4), (.07+Math.exp(-t*1.6)*.35)*fade);
    for (const p of P){
      const dd = p.d*e*(1+ex*1.8);
      const x = cx + Math.cos(p.ang + t*p.sp*.18)*dd + Math.sin(t*p.sp+p.ph)*(p.wob||10) + smx*(p.s||50)*.15;
      const y = cy + Math.sin(p.ang + t*p.sp*.18)*dd*.8 + Math.cos(t*p.sp*.8+(p.ph2||p.ph))*(p.wob||10) + smy*(p.s||50)*.15;
      const breathe = 1+.08*Math.sin(t*p.sp*2+p.ph);
      if (p.dust) blob(x,y,p.s*5, p.a*clamp01(e*2)*fade*(.6+.4*Math.sin(t*1.3+p.ph)));
      else blob(x,y,p.s*(.35+.65*e)*breathe*(1+ex*.8)*1.6, p.a*clamp01(e*1.5)*fade*.9);
    }
  } else {
    const boost = Math.exp(-t*1.05)*2.2 + (ex>0 ? ex*ex*4 : 0), cruise = .035;
    const speed = (cruise + boost)*(1/60);
    const scale = Math.max(W,H)*.55;
    for (const p of P){
      const zPrev = p.z + speed*(2.2+boost*9);
      p.z -= speed*(60*(1/60));
      if (p.z<=.02){ p.z = 1; p.x = rnd(-1,1); p.y = rnd(-1,1); continue; }
      const k = 1/p.z, kp = 1/zPrev;
      const x = cx + (p.x + smx*.25)*k*scale*.35, y = cy + (p.y + smy*.25)*k*scale*.35;
      const xp = cx + (p.x + smx*.25)*kp*scale*.35, yp = cy + (p.y + smy*.25)*kp*scale*.35;
      const lum = Math.min(1,(1-p.z)*1.3)*p.a*fade;
      const v = tone();
      ctx.globalAlpha = lum; ctx.strokeStyle = `rgb(${v},${v},${v})`; ctx.lineWidth = .6 + (1-p.z)*1.5;
      ctx.beginPath(); ctx.moveTo(xp,yp); ctx.lineTo(x,y); ctx.stroke();
    }
    blob(cx,cy,R*(.6+ex*3), (.1+Math.exp(-t*1.4)*.9)*fade);
  }
  ctx.globalAlpha = 1;
  if (exitAt!=null && ex>=1 && !frame.done){ frame.done = true; after.classList.add('in'); }
}

/* ---------- controls ---------- */
function start(){
  t0 = performance.now(); exitAt = null; frame.last = 0; frame.done = false;
  copy.className = 'copy'; copy.style.cssText=''; after.classList.remove('in'); build(); clearTimeout(leaveTimer); title.style.cssText = '';
  document.getElementById('note').textContent = notes[variant];
  if (waiting){ copy.classList.toggle('cloud', variant==='cloud'); setTimeout(()=>{ if (waiting) hint.classList.add('in'); }, 600); return; }
  if (typeof hush==='function'){ if (variant==='cloud' && !reduce) introWind(); else hush(); }
  copy.classList.toggle('cloud', variant==='cloud');
  setTimeout(()=>{ if (exitAt==null){ copy.classList.add('in'); } }, reduce?0:(variant==='cloud'?1500:1700));
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
  variant = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed', x===b)); start();
});
document.getElementById('replay').onclick = start;
let leaveTimer=0;
function leave(){ if (exitAt!=null || false) return; clearTimeout(leaveTimer); exitAt = performance.now(); copy.classList.remove('in'); copy.classList.add('out'); if (variant==='cloud') whoosh(); }

/* Wind: synthesised filtered noise whose loudness and pitch follow the same speed curve as the clouds.
   No audio asset; never plays with reduced motion. Both play from a click: the intro waits for one (below). */
let actx, master, noiseBuf, soundOn = true, gust = null;
function audio(){
  actx ??= new (window.AudioContext||window.webkitAudioContext)();
  if (actx.state==='suspended') actx.resume();
  if (!noiseBuf){
    noiseBuf = actx.createBuffer(2, actx.sampleRate*4, actx.sampleRate);
    for (let ch=0; ch<2; ch++){                                  // pinkish noise, decorrelated per ear for width
      const d = noiseBuf.getChannelData(ch); let b0=0,b1=0,b2=0;
      for (let i=0;i<d.length;i++){ const w=Math.random()*2-1; b0=.997*b0+w*.03; b1=.985*b1+w*.06; b2=.95*b2+w*.12; d[i]=(b0+b1+b2+w*.05)*.5; }
    }
  }
  if (!master){
    // Pages can't read or override the system volume, so cap our own output instead: a low master level
    // into a brick-wall limiter keeps peaks around -32 dBFS, far below music or video at the same volume.
    master = actx.createGain(); master.gain.value = .6;
    const lim = actx.createDynamicsCompressor();
    lim.threshold.value = -32; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .002; lim.release.value = .25;
    master.connect(lim).connect(actx.destination);
  }
  return actx;
}
// shape(t) gives 0..1 intensity over `dur` seconds; it drives the air band's level and pitch and the rumble under it.
function wind(shape, dur, level){
  if (!soundOn || reduce) return;
  const ac = audio(), now = ac.currentTime + .02, n = Math.ceil(dur*60);
  const lvl = new Float32Array(n), hz = new Float32Array(n), low = new Float32Array(n);
  for (let i=0;i<n;i++){ const k = clamp01(shape(i/(n-1)*dur)); lvl[i] = level*Math.pow(k,1.4)+1e-4; low[i] = level*1.3*k+1e-4; hz[i] = 240 + 1150*k; }
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const air = ac.createBiquadFilter(); air.type='bandpass'; air.Q.value=.8; air.frequency.setValueCurveAtTime(hz, now, dur);
  const airG = ac.createGain(); airG.gain.setValueCurveAtTime(lvl, now, dur);
  const body = ac.createBiquadFilter(); body.type='lowpass'; body.frequency.value=170;
  const bodyG = ac.createGain(); bodyG.gain.setValueCurveAtTime(low, now, dur);
  const out = ac.createGain(); out.gain.value = 1;
  src.connect(air).connect(airG).connect(out); src.connect(body).connect(bodyG).connect(out); out.connect(master);
  src.start(now, Math.random()*1.5); src.stop(now+dur+.05);
  return {out, src};
}
function hush(){                                                  // fade whatever is playing instead of cutting it
  if (!gust || !actx) return; const now = actx.currentTime;
  gust.out.gain.cancelScheduledValues(now); gust.out.gain.setValueAtTime(gust.out.gain.value, now); gust.out.gain.setTargetAtTime(0, now, .25);
  gust.src.stop(now+1.5); gust = null;
}
// Intro: matches the cloud speed curve (ease in over 0.7s, hold, long exponential ease-out) with a faint breeze left at rest.
function introWind(){
  hush();
  gust = wind(t=>{ const r = smooth(clamp01(t/.7))*Math.exp(-Math.max(0,t-1.3)/1.05); return .55*r + .05*(1-smooth(clamp01((t-3)/2.5))); }, 5.5, .12);
}
// Exit: builds with the dive, then eases out slowly as the mist closes in.
function whoosh(){
  hush();
  gust = wind(t=> t<1.1 ? .7*Math.pow(t/1.1,2) : .7*Math.exp(-Math.pow((t-1.1)/.75,1.6)), 3, .17);
}
document.getElementById('sound').onclick = e=>{ soundOn = !soundOn; e.target.setAttribute('aria-pressed', soundOn); if (!soundOn) hush(); };
document.getElementById('go').onclick = leave; document.getElementById('skip').onclick = leave;
document.getElementById('theme').onclick = e=>{
  const r = document.documentElement, light = r.dataset.theme==='light';
  r.dataset.theme = light ? 'dark':'light'; e.target.textContent = light ? 'Light':'Dark';
};
/* Hold the intro until the user has clicked into the app: the animation and its wind then start together
   (browsers only allow sound after a gesture). Clouds drift slowly in the meantime. */
const hint = document.getElementById('hint');
let waiting = !reduce && !navigator.userActivation?.hasBeenActive;
function begin(e){
  if (!waiting) return;
  waiting = false; hint.classList.remove('in');
  removeEventListener('pointerdown', begin, true); removeEventListener('keydown', begin, true);
  if (!e.target.closest?.('.bar')) start();                     // toolbar buttons start it themselves
}
addEventListener('pointerdown', begin, true); addEventListener('keydown', begin, true);
resize(); start(); requestAnimationFrame(frame);
</script>
</body>
