<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-account Browsing</title>
<style>
/* One mock window per state; the segmented switch picks the state. Tokens mirror src/styles/theme.css. */
:root {
  --workspace: #0f0f0f; --bg: #131313; --sidebar: #161616; --card: #191919; --border: #262626; --border-strong: #3c3c3c;
  --hover: #2b2b2b; --active: #3e3e3e; --text: #e0e0e0; --bright: #f1f1f1; --muted: #8c8c8c;
  --page: #f6f6f4; --page-ink: #1c1c1c; --page-muted: #6b6b6b;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: #0b0b0b; color: var(--text); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 56px; display: grid; gap: 18px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--bright); }
p { margin: 0; color: var(--muted); max-width: 76ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--border); border-radius: 9px; padding: 3px; background: var(--card); justify-self: start; }
.seg button { font: 500 13px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bright); color: #111; }
.seg button:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
.caption { display: grid; gap: 4px; }
.caption strong { font-size: 15px; color: var(--bright); }
.stage { overflow-x: auto; padding-bottom: 6px; }

/* The window. */
.win { position: relative; width: 1080px; height: 660px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: var(--workspace); border: 1px solid #2a2a2a;
  display: grid; grid-template-columns: 252px 1fr; gap: 6px; padding: 6px; }
.win.small { width: 760px; height: 560px; grid-template-columns: 1fr; padding: 0; }
.win.wash { background: color-mix(in srgb, #5b6b86 16%, var(--workspace)); }
.lights { display: flex; gap: 7px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #3a3a3a; display: block; }

.side { display: grid; grid-template-rows: auto 1fr auto; gap: 6px; min-height: 0; }
.side .card { background: var(--sidebar); border-radius: 10px; display: grid; grid-template-rows: auto auto auto auto 1fr auto; gap: 8px; padding: 10px; min-height: 0; }
.head { display: flex; align-items: center; gap: 10px; height: 24px; }
.head .nav { margin-left: auto; display: flex; gap: 10px; color: var(--muted); }
.addr { height: 32px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12.5px; color: var(--text); }
.favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.favs span { height: 38px; border-radius: 8px; background: var(--card); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; }
.row.on { background: var(--hover); color: var(--bright); }
.row .fav { width: 16px; height: 16px; border-radius: 4px; background: #333; flex: none; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #bbb; }
.row.muted { color: var(--muted); }
.tabs { display: grid; gap: 2px; align-content: start; overflow: hidden; }
.foot { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; padding: 2px 4px; }
.acct { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 10px; border-radius: 10px; background: var(--sidebar); }
.acct .who { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--text); height: 30px; border-radius: 8px; padding: 0 4px; }
.acct .who.signin { outline: 1px dashed transparent; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--active); color: var(--bright); font-size: 11px; font-weight: 600; flex: none; }
.avatar.ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--muted); }
.icobtn { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icobtn:hover { background: var(--hover); }

.main { display: grid; grid-template-rows: auto 1fr; gap: 6px; min-height: 0; }
.spacebar { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.spacebar .name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--bright); padding: 4px 8px; border-radius: 8px; }
.spacebar .sq { width: 20px; height: 20px; border-radius: 6px; background: #4a5568; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.spacebar .gap { flex: 1; }
.page { background: var(--page); color: var(--page-ink); border-radius: 10px; overflow: hidden; position: relative; }
.site { padding: 34px 48px; display: grid; gap: 18px; }
.site nav { display: flex; gap: 22px; font-size: 13px; color: var(--page-muted); }
.site nav b { color: var(--page-ink); margin-right: auto; font-size: 15px; }
.site h2 { margin: 18px 0 0; font: 600 34px/1.15 var(--sans); letter-spacing: -0.02em; max-width: 18ch; }
.site .lede { color: var(--page-muted); max-width: 52ch; font-size: 15px; }
.site .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
.site .cards div { height: 150px; border-radius: 10px; background: #e7e7e3; }

/* Dialogs over the window. */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; z-index: 5; }
.dlg { width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
.dlg.wide { width: 470px; }
.dlg h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--bright); letter-spacing: -0.01em; }
.dlg .help { font-size: 13px; color: var(--muted); }
.field { height: 36px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); display: flex; align-items: center; padding: 0 11px; font-size: 13px; color: var(--muted); }
.btn { font: 500 13px var(--sans); height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: default; white-space: nowrap; }
.btn.pri { background: var(--bright); color: #111; border-color: var(--bright); }
.btn.lg { height: 42px; padding: 0 26px; font-size: 14px; border-radius: 10px; }
.btn.full { width: 100%; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
.or { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.foot-link { font-size: 12.5px; color: var(--muted); text-align: center; }
.foot-link u { color: var(--text); text-underline-offset: 2px; }
.list { display: grid; border-top: 1px solid var(--border); }
.list div { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.list span:last-child { color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text); }
.check .box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-strong); flex: none; margin-top: 2px; }
.check small { display: block; color: var(--muted); font-size: 12px; }
.reasons { display: inline-flex; gap: 2px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; background: var(--card); }
.reasons button { font: 500 12px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.reasons button[aria-pressed="true"] { background: var(--active); color: var(--bright); }

/* First-run welcome (the existing WelcomePage, no longer a gate). */
.welcome { display: grid; place-items: center; text-align: center; height: 100%; background: var(--workspace); position: relative; }
.welcome .lights { position: absolute; top: 14px; left: 14px; }
.welcome h2 { margin: 0; font: 500 44px/1.25 var(--sans); letter-spacing: -0.035em; color: var(--bright); }
.welcome h2 span { display: block; font-weight: 400; color: var(--muted); }
.welcome .cta { display: flex; gap: 12px; justify-content: center; margin-top: 26px; }
.welcome .note { margin-top: 16px; font-size: 13px; color: var(--muted); }
.welcome footer { position: absolute; left: 24px; right: 24px; bottom: 16px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* Settings. */
.settings { position: absolute; inset: 0; background: var(--bg); display: grid; grid-template-columns: 230px 1fr; z-index: 4; }
.settings aside { background: var(--sidebar); padding: 44px 12px 12px; display: grid; align-content: start; gap: 2px; }
.settings .search { height: 30px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); display: flex; align-items: center; padding: 0 10px; margin-bottom: 12px; }
.settings .group { font-size: 11.5px; color: var(--muted); padding: 10px 10px 4px; }
.settings .item { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 13px; color: var(--text); }
.settings .item.on { background: var(--hover); color: var(--bright); }
.settings section { padding: 44px 56px; display: grid; align-content: start; gap: 6px; overflow: hidden; }
.settings h4 { margin: 18px 0 2px; font-size: 13px; font-weight: 600; color: var(--bright); }
.settings h4:first-child { margin-top: 0; }
.settings .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.srow { display: grid; grid-template-columns: 1fr 240px; gap: 24px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.srow .l { font-size: 13px; color: var(--text); }
.srow .l small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.srow .c { display: flex; justify-content: flex-end; }
.switch { width: 34px; height: 20px; border-radius: 999px; background: var(--active); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
.switch.on { background: var(--bright); }
.switch.on::after { left: 17px; background: #111; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 13px; color: var(--text); display: flex; gap: 12px; align-items: center; z-index: 6; box-shadow: 0 8px 26px rgba(0,0,0,0.45); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Browsing without an account</h1>
  <p>Mockups for parity item C16. Misty opens straight into a full browser. An account is asked for only when someone turns on sync, creates or joins a Space, or uses an agent. Black, white and gray only; the Space color appears once a Space exists.</p>
  <div class="seg" id="states" role="group" aria-label="State">
    <button type="button" data-s="first">First run</button>
    <button type="button" data-s="window">Signed out</button>
    <button type="button" data-s="dialog">Sign-in sheet</button>
    <button type="button" data-s="settings">Settings › Sync</button>
    <button type="button" data-s="merge">Merge on sync</button>
    <button type="button" data-s="signedin">Signed in</button>
    <button type="button" data-s="signout">Sign out</button>
  </div>
  <div class="caption"><strong id="t"></strong><p id="d"></p></div>
  <div class="stage" id="stage"></div>
</div>
<script>
const I = {
  back: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  fwd: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>`,
  reload: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>`,
  side: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>`,
  lock: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  dl: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`,
  gear: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  sync: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16M3 12A9 9 0 0 1 18.5 5.7L21 8M21 3v5h-5M3 21v-5h5"/></svg>`,
  user: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`,
  home: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,
  chat: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  people: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>`,
  brain: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 3a3 3 0 0 0-3 3 3 3 0 0 0-2.5 4.5A3.5 3.5 0 0 0 6 17a3 3 0 0 0 3.5 4 2.5 2.5 0 0 0 2.5-2.5V5.5A2.5 2.5 0 0 0 9.5 3zM14.5 3a3 3 0 0 1 3 3 3 3 0 0 1 2.5 4.5A3.5 3.5 0 0 1 18 17a3 3 0 0 1-3.5 4 2.5 2.5 0 0 1-2.5-2.5"/></svg>`,
  bot: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/></svg>`,
  chev: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`,
  g: `<svg width="15" height="15" viewBox="0 0 24 24"><path fill="#e0e0e0" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22zM6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#8c8c8c" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z"/></svg>`,
};

const tabs = [["W", "Wikipedia — Browser engine", true], ["G", "Pull requests · misty-org"], ["Y", "Lo-fi beats to code to"], ["N", "The New Yorker"], ["M", "Maps — Lisbon"], ["H", "Hacker News"]];

function sidebar(signedIn) {
  const acct = signedIn
    ? `<div class="acct"><div class="who"><span class="avatar">MK</span>Matt K.</div><span class="icobtn" title="Sync">${I.sync}</span><span class="icobtn" title="Settings">${I.gear}</span></div>`
    : `<div class="acct"><div class="who signin"><span class="avatar ghost">${I.user}</span>Sign in</div><span class="icobtn" title="Settings">${I.gear}</span></div>`;
  return `<div class="side">
    <div class="card">
      <div class="head"><div class="lights"><i></i><i></i><i></i></div><div class="nav">${I.side}${I.back}${I.fwd}${I.reload}</div></div>
      <div class="addr">${I.lock}<span>en.wikipedia.org/wiki/Browser_engine</span></div>
      <div class="favs"><span>Gm</span><span>Cal</span><span>GH</span><span>Fig</span></div>
      <div class="row muted">${I.plus}New Tab</div>
      <div class="tabs">${tabs.map(([f, t, on]) => `<div class="row${on ? " on" : ""}"><span class="fav">${f}</span>${t}</div>`).join("")}</div>
      <div class="foot"><span style="display:flex;gap:8px;align-items:center">${I.dl}Downloads</span></div>
    </div>
    <div></div>
    ${acct}
  </div>`;
}

function page() {
  return `<div class="page"><div class="site">
    <nav><b>Wikipedia</b><span>Article</span><span>Talk</span><span>History</span></nav>
    <h2>Browser engine</h2>
    <div class="lede">A browser engine is the core software component of every major web browser. Its job is to turn HTML documents and other resources into an interactive visual page.</div>
    <div class="cards"><div></div><div></div><div></div></div>
  </div></div>`;
}

function spaceBar() {
  return `<div class="spacebar">
    <div class="name"><span class="sq">P</span>Personal ${I.chev}</div>
    <span class="icobtn">${I.home}</span><span class="icobtn">${I.chat}</span><span class="icobtn">${I.people}</span><span class="icobtn">${I.brain}</span>
    <span class="gap"></span><span class="icobtn">${I.bot}</span>
  </div>`;
}

function windowFrame({ signedIn = false, overlay = "", wash = false } = {}) {
  return `<div class="win${wash ? " wash" : ""}">${sidebar(signedIn)}
    <div class="main" style="${signedIn ? "" : "grid-template-rows:1fr"}">${signedIn ? spaceBar() : ""}${page()}</div>
    ${overlay}</div>`;
}

const REASONS = {
  sync: ["Sign in to turn on sync", "Your tabs, bookmarks, passwords and history sync end-to-end encrypted between your devices. What's already on this Mac comes with you."],
  space: ["Sign in to create a Space", "A Space keeps one part of your life apart, with its own tabs, sign-ins, memory and agents, and you can share it with people. Your browsing on this Mac becomes your personal Space."],
  ai: ["Sign in to use agents", "Agents run on Misty's servers, so they need an account. Browsing stays free and works without one."],
  invite: ["Sign in to join a Space", "You were invited to a Space. Sign in or create an account to join it."],
};
let reason = "sync";
function signInSheet() {
  const [title, help] = REASONS[reason];
  return `<div class="reasons" id="reasons">${Object.keys(REASONS).map((k) => `<button type="button" data-r="${k}" aria-pressed="${k === reason}">${{ sync: "Sync", space: "New Space", ai: "Agent shortcut", invite: "Invite link" }[k]}</button>`).join("")}</div>
  <div class="scrim"><div class="dlg">
    <h3>${title}</h3>
    <div class="help">${help}</div>
    <button class="btn full">${I.g}Continue with Google</button>
    <div class="or">or</div>
    <div class="field">Email</div>
    <div class="field">Password</div>
    <button class="btn pri full">Sign in</button>
    <div class="foot-link">New to Misty? <u>Create account</u></div>
    <div class="actions" style="justify-content:center"><button class="btn ghost">Not now</button></div>
  </div></div>`;
}

function settingsPage() {
  const nav = [["General", "Settings", true], ["Appearance"], ["Shortcuts"], ["Privacy"], ["Sync", "", "on"], ["Devices"], ["Browsing", "Browser", true], ["Passwords"], ["Permissions"]];
  return `<div class="settings">
    <aside><div class="search">Search</div>
      ${nav.map(([n, g, x]) => `${g ? `<div class="group">${g}</div>` : ""}<div class="item${x === "on" ? " on" : ""}">${n}</div>`).join("")}
    </aside>
    <section>
      <h4>Sync</h4>
      <div class="sub">Sync keeps your browsing the same on every device you sign in on, end-to-end encrypted: Misty's servers hold only data they can't read.</div>
      <div class="srow"><div class="l">Sync is off<small>Sign in to sync tabs, bookmarks, passwords, history and extensions.</small></div><div class="c"><button class="btn pri">Sign in</button></div></div>
      <h4>On this Mac</h4>
      <div class="sub">Without an account, everything stays on this Mac, encrypted with a key in the macOS keychain. Nothing is sent to Misty.</div>
      <div class="srow"><div class="l">Bookmarks, passwords and history<small>Kept on this Mac. Signing in later brings them into your account.</small></div><div class="c" style="color:var(--muted);font-size:13px">On this Mac</div></div>
      <div class="srow"><div class="l">Open tabs<small>Reopened at launch, as Browsing › Startup sets.</small></div><div class="c" style="color:var(--muted);font-size:13px">On this Mac</div></div>
    </section>
  </div>`;
}

function mergeSheet() {
  return `<div class="scrim"><div class="dlg wide">
    <h3>Add this Mac's browsing to your account?</h3>
    <div class="help">Your account already syncs from 2 other devices. What's on this Mac joins your personal Space, and duplicates are skipped.</div>
    <div class="list">
      <div><span>Bookmarks</span><span>214</span></div>
      <div><span>Saved passwords</span><span>38</span></div>
      <div><span>History</span><span>12,408 visits</span></div>
      <div><span>Extensions</span><span>6</span></div>
      <div><span>Search shortcuts</span><span>3</span></div>
    </div>
    <div class="help">Open tabs stay this Mac's own, beside your other devices' tabs.</div>
    <div class="actions"><button class="btn">Not now</button><button class="btn pri">Merge and turn on sync</button></div>
  </div></div>`;
}

function signOutSheet() {
  return `<div class="scrim"><div class="dlg wide">
    <h3>Sign out of Misty?</h3>
    <div class="help">Sync, Spaces and agents stop on this Mac. You keep browsing with the tabs, bookmarks, passwords, history and extensions of your personal Space.</div>
    <label class="check"><span class="box"></span><span>Also remove my browsing data from this Mac<small>Erases tabs, bookmarks, passwords, history and website sign-ins here. Your account keeps its synced copy.</small></span></label>
    <div class="actions"><button class="btn">Cancel</button><button class="btn pri">Sign out</button></div>
  </div></div>`;
}

const STATES = {
  first: {
    t: "First run: the welcome screen is no longer a gate",
    d: "Today's WelcomePage shows once, on first launch, with Start browsing as the primary action. Sign in stays beside it for people who already have an account. Start browsing goes to setup (import from your browser, which side the tabs sit on), then a full window. Later launches open the browser directly.",
    html: () => `<div class="win small"><div class="welcome"><div class="lights"><i></i><i></i><i></i></div>
      <div><h2>Welcome to Misty<span>The agentic browser workspace</span></h2>
      <div class="cta"><button class="btn pri lg">Start browsing</button><button class="btn lg">Sign in</button></div>
      <div class="note">No account needed. Sign in later to sync, share Spaces or use agents.</div></div>
      <footer><span>© 2026 Misty</span><span>Terms · Privacy Policy</span></footer></div></div>`,
  },
  window: {
    t: "A signed-out window: the whole browser, and no Space bar",
    d: "Tabs, favorites, groups, bookmarks, history, downloads, passwords, extensions and incognito all work. Every control in the Space bar (Spaces menu, Home, Chat, People, Memory, Agents) needs an account, so the bar isn't shown and the page takes its height. The window has no Space color. The sidebar's account row reads Sign in and opens the sign-in sheet; Sync is not shown until there is an account.",
    html: () => windowFrame(),
  },
  dialog: {
    t: "The sign-in sheet opens over the window and says why",
    d: "One sheet for every reason, over the browsing window instead of shrinking it into the small sign-in window. Its title and line say what asked: Sync, New Space (the Spaces menu or the account row's menu), an agent shortcut (the companion or dictation hotkey) or a Space invite link. Not now returns to the page. Pick a reason above the sheet.",
    html: () => windowFrame({ overlay: signInSheet() }),
  },
  settings: {
    t: "Settings › Sync while signed out",
    d: "Settings belong to the device, so every page works signed out. Sync and Devices keep their page with a Sign in row. The Agents group (Conversations, Cursor, Apps, Memory) is hidden until there is an account. Plain list, one control column, helper text under each row.",
    html: () => `<div class="win" style="grid-template-columns:1fr;padding:0">${settingsPage()}</div>`,
  },
  merge: {
    t: "Turning on sync for an account that already has data",
    d: "A new account takes this Mac's browsing as its personal Space with nothing to confirm. Signing in to an account that already syncs from other devices asks once, when sync turns on, with counts. Merging skips duplicates, newest wins for a changed password, and tabs never merge because each device keeps its own workspace.",
    html: () => windowFrame({ overlay: mergeSheet() }),
  },
  signedin: {
    t: "After sign-in: the same window gains its Space bar",
    d: "Nothing reloads and no tab closes: this Mac's browsing is now the account's personal Space on this device. The Space bar slides in above the pages, the window takes the Space's color, and the account row shows the person with Sync and Settings beside it.",
    html: () => windowFrame({ signedIn: true, wash: true, overlay: `<div class="toast">Signed in. Your browsing on this Mac is now your personal Space.<button class="btn" style="height:28px">Turn on sync</button></div>` }),
  },
  signout: {
    t: "Signing out keeps browsing",
    d: "Signing out no longer ends at the welcome screen. The window keeps browsing with the personal Space's data, now unowned again; other Spaces close on this Mac. Removing the data is an explicit choice, off by default.",
    html: () => windowFrame({ signedIn: true, wash: true, overlay: signOutSheet() }),
  },
};

function show(s) {
  document.querySelectorAll("#states button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  document.getElementById("t").textContent = STATES[s].t;
  document.getElementById("d").textContent = STATES[s].d;
  document.getElementById("stage").innerHTML = STATES[s].html();
  document.querySelectorAll("#reasons button").forEach((b) => b.addEventListener("click", () => { reason = b.dataset.r; show("dialog"); }));
}
document.querySelectorAll("#states button").forEach((b) => b.addEventListener("click", () => show(b.dataset.s)));
show("window");
</script>
</body>
</html>
